# ---------------------------------------------------------------------------
# Automation 01 — Package Detection (front door)
# Trigger: motion → snapshot → LLM Vision → notify on package present.
# Prompt source of truth: ../prompts/package.md
# ---------------------------------------------------------------------------
- id: ai_vision_01_package_detection
  alias: "AI Vision 01 — Package Detection (front door)"
  description: >-
    On front-door motion, analyze a snapshot to detect a delivered package and
    notify (with snapshot) when one is present. Cooldown + fallback handled by
    script.ai_vision_analyze.
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: binary_sensor.front_door_motion
      from: "off"
      to: "on"
  condition: []
  action:
    - service: script.ai_vision_analyze
      data:
        use_case: package
        camera_entity: camera.front_door
        notify_target: mobile_app_mohamed
        cooldown_helper: input_datetime.front_door_last_ai
        cooldown_minutes: 5
        title: "Front door"
        prompt: >-
          You are a home security vision assistant analyzing a single snapshot
          from a front-door camera. Determine whether a delivered package or
          parcel is present near the door. A package is any delivered box,
          envelope, parcel, bag, or container left on the ground/step/porch, not
          items a person is actively carrying away. Be concise and factual;
          describe only what is visible; do not guess identities. If image
          quality is too poor to judge, say so and use confidence "low".
          OUTPUT FORMAT (MANDATORY): at most TWO sentences of plain description,
          then exactly ONE line of compact JSON on its own line:
          {"category":"package","present":<true|false>,"confidence":"<low|medium|high>","action":"<notify|log|ignore>"}.
          Set present=true only if a delivered package is visibly on the
          ground/step/porch. action="notify" if a package is present with
          medium+ confidence; "log" if uncertain; "ignore" if clearly nothing
          relevant.
